<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nốt Rơi – Nghe và học bài MIDI trên đàn của bạn</title>
  <meta name="description" content="Mở file MIDI, phát qua đàn organ của bạn, chỉnh âm sắc và âm lượng từng phần, rồi học bài với nốt rơi.">
  <meta name="theme-color" content="#13101a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,800&family=Be+Vietnam+Pro:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand" aria-label="Nốt Rơi">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="3" width="28" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M11.3 3v26M20.7 3v26" stroke="currentColor" stroke-width="1.6"/>
        <rect x="8.2" y="3" width="6.2" height="15" rx="1.4" fill="currentColor"/>
        <rect x="17.6" y="3" width="6.2" height="15" rx="1.4" fill="currentColor"/>
      </svg>
      <span class="brand-name">Nốt Rơi</span>
    </div>

    <div class="top-actions">
      <button class="device" id="btn-device" type="button" aria-haspopup="dialog">
        <span class="led" id="led" aria-hidden="true"></span>
        <span id="device-label">Kết nối đàn</span>
      </button>
      <button class="btn-ghost" id="btn-install" type="button" hidden>Cài app</button>
      <button class="btn-ghost" id="btn-library" type="button" aria-haspopup="dialog">Bản nhạc của tôi</button>
      <button class="btn-ghost" id="btn-settings" type="button" aria-haspopup="dialog">Cài đặt</button>
    </div>
  </header>

  <main class="main">
    <div id="studio-root"></div>
  </main>

  <footer class="foot">
    <span>Nốt Rơi <span id="foot-ver"></span></span>
    <span class="dot" aria-hidden="true"></span>
    <span>Làm bởi <b id="foot-author"></b></span>
  </footer>
</div>

<div class="drop" id="drop" hidden><div>Thả file .mid vào đây để mở</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg-device"><div class="dlg" id="dlg-device-body"></div></dialog>
<dialog id="dlg-settings"><div class="dlg" id="dlg-settings-body"></div></dialog>
<dialog id="dlg-library"><div class="dlg" id="dlg-library-body"></div></dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
