<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nốt Rơi - Chơi nốt</title>
  <meta name="description" content="Mở file MIDI, phát qua đàn organ của bạn, chỉnh âm sắc và âm lượng từng phần, rồi học bài với nốt rơi.">
  <meta name="theme-color" content="#1b1a4a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <script>window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; });</script>
  <!-- stamp:start -->
  <link rel="stylesheet" href="css/fonts.css?v=0.19.3">
  <link rel="stylesheet" href="css/style.css?v=0.19.3">
  <script type="importmap">{"imports":{"./js/export.js":"./js/export.js?v=0.19.3","./js/learn.js":"./js/learn.js?v=0.19.3","./js/midi.js":"./js/midi.js?v=0.19.3","./js/midiui.js":"./js/midiui.js?v=0.19.3","./js/pianodock.js":"./js/pianodock.js?v=0.19.3","./js/player.js":"./js/player.js?v=0.19.3","./js/progress.js":"./js/progress.js?v=0.19.3","./js/songmidi.js":"./js/songmidi.js?v=0.19.3","./js/store.js":"./js/store.js?v=0.19.3","./js/title.js":"./js/title.js?v=0.19.3","./js/version.js":"./js/version.js?v=0.19.3"}}</script>
  <!-- stamp:end -->
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand" aria-label="Nốt Rơi">
      <span class="logo" aria-hidden="true"><img src="assets/favicon.svg" alt="" width="48" height="48"></span>
      <div class="brand-text">
        <div class="brand-row"><span class="brand-name">Nốt Rơi</span><span class="ver-pill" id="foot-ver"></span></div>
        <div class="brand-credit"><span>Made by <b id="foot-author"></b></span><span class="sep" aria-hidden="true"></span><span id="foot-year"></span></div>
      </div>
    </div>

    <div class="top-actions">
      <button class="device" id="btn-device" type="button" aria-haspopup="dialog">
        <span class="led" id="led" aria-hidden="true"></span>
        <span id="device-label">Kết nối đàn</span>
      </button>
      <button class="btn-install" id="btn-install" type="button" aria-haspopup="dialog">Tạo lối tắt</button>
      <button class="btn-ghost" id="btn-settings" type="button" aria-haspopup="dialog">Cài đặt</button>
    </div>
  </header>

  <main class="main">
    <div id="studio-root"></div>
  </main>

</div>

<div class="drop" id="drop" hidden><div>Thả file .mid vào đây để mở</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg-device"><div class="dlg" id="dlg-device-body"></div></dialog>
<dialog id="dlg-settings"><div class="dlg" id="dlg-settings-body"></div></dialog>
<dialog id="dlg-kho" class="kho"><div class="dlg" id="dlg-kho-body"></div></dialog>
<dialog id="dlg-library"><div class="dlg" id="dlg-library-body"></div></dialog>

<div id="piano-dock" class="piano-dock"></div>
<script type="module" src="js/app.js?v=0.19.3"></script>
</body>
</html>
