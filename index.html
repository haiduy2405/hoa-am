<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hòa Âm – Dò hợp âm và sửa nhạc MIDI từ đàn của bạn</title>
  <meta name="description" content="Nối đàn organ qua USB, chơi đến đâu Hòa Âm đọc hợp âm đến đó. Mở file MIDI, sửa từng nốt, phát qua đàn và tải về thành bài của bạn.">
  <meta name="theme-color" content="#13101a">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <a class="brand" href="#hop-am" aria-label="Hòa Âm">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="3" width="28" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M11.3 3v26M20.7 3v26" stroke="currentColor" stroke-width="1.6"/>
        <rect x="8.2" y="3" width="6.2" height="15" rx="1.4" fill="currentColor"/>
        <rect x="17.6" y="3" width="6.2" height="15" rx="1.4" fill="currentColor"/>
      </svg>
      <span class="brand-name">Hòa Âm</span>
    </a>

    <nav class="nav" role="tablist" aria-label="Khu làm việc">
      <button class="nav-tab" id="tab-chords" role="tab" aria-selected="true" aria-controls="view-chords" type="button">Hợp âm</button>
      <button class="nav-tab" id="tab-midi" role="tab" aria-selected="false" aria-controls="view-midi" type="button">Nhạc MIDI</button>
    </nav>

    <div class="top-actions">
      <button class="device" id="btn-device" type="button" aria-haspopup="dialog">
        <span class="led" id="led" aria-hidden="true"></span>
        <span id="device-label">Kết nối đàn</span>
      </button>
      <button class="btn-ghost" id="btn-library" type="button" aria-haspopup="dialog">Bản nhạc của tôi</button>
      <button class="btn-ghost" id="btn-settings" type="button" aria-haspopup="dialog">Cài đặt</button>
    </div>
  </header>

  <main class="main">

    <!-- ============ Hợp âm ============ -->
    <div class="view" id="view-chords" role="tabpanel" aria-labelledby="tab-chords">

      <section class="live" aria-label="Hợp âm đang chơi">
        <div class="live-chord">
          <div class="staff" aria-hidden="true"></div>
          <p class="live-kicker">Đang chơi</p>
          <div class="chord-live" id="chord-live" aria-live="polite" aria-atomic="true"></div>
          <div class="notes-line">
            <span id="notes-readout" class="notes-readout"></span>
            <button type="button" class="link-btn" id="btn-notes-mode" title="Đổi cách gọi tên nốt"></button>
          </div>
          <button type="button" class="btn-capture" id="btn-capture" disabled>Thêm vào bản hợp âm</button>
        </div>

        <div class="live-side">
          <section class="block" aria-labelledby="h-alt">
            <h2 id="h-alt">Cách đọc khác</h2>
            <ol class="alt-list" id="alt-list"></ol>
          </section>
          <section class="block" aria-labelledby="h-ana">
            <h2 id="h-ana">Vị trí trong tông</h2>
            <div id="analysis" class="analysis"></div>
          </section>
        </div>

        <div class="keys" id="keyboard" role="img" aria-label="Phím đàn, sáng lên theo nốt bạn đang chơi"></div>
      </section>

      <section class="suggest" aria-labelledby="h-sug">
        <div class="suggest-head">
          <h2 id="h-sug">Hợp âm tiếp theo</h2>
          <p id="suggest-hint" class="hint"></p>
        </div>
        <div class="suggest-list" id="suggest-list"></div>
      </section>

      <section class="sheet-panel" id="sheet-wrap" aria-label="Bản hợp âm">
        <div class="sheet-head">
          <div class="sheet-title">
            <input id="title" class="title" type="text" placeholder="Đặt tên bài" aria-label="Tên bài" autocomplete="off" maxlength="80">
            <p class="key-note" id="key-note"></p>
          </div>
          <button class="btn-primary" id="btn-export" type="button" aria-haspopup="dialog">Xuất file</button>
        </div>

        <div class="sheet-tools" role="toolbar" aria-label="Công cụ bản hợp âm">
          <label class="field">Tông
            <select id="sel-key" aria-label="Tông của bài"></select>
          </label>
          <div class="stepper" role="group" aria-label="Chuyển tông">
            <span class="stepper-label">Chuyển tông</span>
            <button class="step" id="tr-down" type="button" aria-label="Hạ nửa cung">−</button>
            <output id="tr-val">0</output>
            <button class="step" id="tr-up" type="button" aria-label="Nâng nửa cung">+</button>
          </div>
          <label class="field">Nhịp
            <select id="sel-beats" aria-label="Số phách mỗi ô nhịp">
              <option value="2">2/4</option><option value="3">3/4</option><option value="4">4/4</option>
              <option value="5">5/4</option><option value="6">6/4</option>
            </select>
          </label>
          <label class="field">Tempo
            <input class="num" id="bpm" type="number" min="30" max="260" inputmode="numeric" aria-label="Tempo, nhịp mỗi phút">
          </label>
          <button class="toggle" id="t-roman" type="button" aria-pressed="true">Số La Mã</button>
          <span class="tools-spacer"></span>
          <button class="btn-ghost" id="btn-undo" type="button" title="Ctrl+Z">Hoàn tác</button>
          <button class="btn-ghost" id="btn-redo" type="button" title="Ctrl+Shift+Z">Làm lại</button>
        </div>

        <div class="sheet" id="sheet"></div>
        <div class="sheet-foot">
          <button class="btn-ghost" id="btn-addrow" type="button">Thêm một hàng</button>
          <button class="btn-ghost danger" id="btn-clear" type="button">Xóa hết hợp âm</button>
        </div>
      </section>
    </div>

    <!-- ============ Nhạc MIDI ============ -->
    <div class="view" id="view-midi" role="tabpanel" aria-labelledby="tab-midi" hidden>
      <div id="studio-root"></div>
    </div>
  </main>
</div>

<div class="editor" id="editor" hidden role="dialog" aria-label="Sửa hợp âm"></div>
<div class="drop" id="drop" hidden><div>Thả file .mid vào đây để mở</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg-device"><div class="dlg" id="dlg-device-body"></div></dialog>
<dialog id="dlg-settings"><div class="dlg" id="dlg-settings-body"></div></dialog>
<dialog id="dlg-library"><div class="dlg" id="dlg-library-body"></div></dialog>
<dialog id="dlg-chords"><div class="dlg" id="dlg-chords-body"></div></dialog>
<dialog id="dlg-export"><div class="dlg" id="dlg-export-body"></div></dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
